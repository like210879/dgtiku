name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: |
          npm install
          npm install @capacitor/android@^7

      - name: 添加安卓工程
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: 同步网页
        run: npx cap sync android

      - name: 生成图标（失败不中断）
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#164E6E" --iconBackgroundColorDark "#122128" || true

      - name: 设置应用名
        run: |
          FILE=android/app/src/main/res/values/strings.xml
          if [ -f "$FILE" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">电工刷题</string>|' "$FILE"
            sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">电工刷题</string>|' "$FILE"
          fi
          echo "--- strings.xml ---"
          cat "$FILE" || true

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 打包
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/电工刷题.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk out/dgtiku.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: dgtiku-apk
          path: out/dgtiku.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: 电工刷题 v1.0
          body: 安卓 APK（debug 签名，可直接安装）与 iOS 未签名 IPA（巨魔安装）
          files: out/dgtiku.apk
          fail_on_unmatched_files: false
