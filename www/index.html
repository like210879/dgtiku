<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>电工考证刷题 · 600题</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23164E6E'/%3E%3Cpath d='M36 8 18 36h12l-6 20 20-30H30z' fill='%23F2B322'/%3E%3C/svg%3E">
<style>
/* ===== tokens ===== */
:root{
  --ink:#12212B;
  --ink-2:#4A5D6B;
  --ink-3:#7C8E9A;
  --paper:#F1F5F6;
  --card:#FFFFFF;
  --line:#D8E2E7;
  --line-2:#E9F0F3;
  --blue:#164E6E;
  --blue-2:#2C7BA8;
  --blue-soft:#E7F0F5;
  --yellow:#F2B322;
  --yellow-soft:#FDF3D9;
  --green:#2C7752;
  --green-soft:#E6F2EA;
  --red:#B4402C;
  --red-soft:#FBEBE7;
  --shadow:0 1px 2px rgba(18,33,43,.06), 0 8px 24px rgba(18,33,43,.05);
  --r:12px;
  --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  background:#E6ECEF;
  background-image:
    linear-gradient(to right,rgba(97,124,140,.10) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(97,124,140,.10) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}
[hidden]{display:none!important}
.app{
  max-width:560px;margin:0 auto;min-height:100dvh;background:var(--paper);
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 0 0 1px rgba(18,33,43,.06),0 24px 60px rgba(18,33,43,.10);
}
@media (max-width:580px){
  .app{max-width:none;box-shadow:none}
  body{background:var(--paper);background-image:none}
}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(241,245,246,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;min-height:54px;
}
.topbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
.topbar .sub{font-size:12px;color:var(--ink-3);letter-spacing:.4px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--line-2)}
.iconbtn svg{width:20px;height:20px}
.spacer{flex:1}
main{padding:16px;flex:1;display:flex;flex-direction:column}
.tabbar{
  position:sticky;bottom:0;z-index:30;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0;border-radius:10px;color:var(--ink-3);font-size:13px;
}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--blue);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;gap:8px;margin:22px 2px 10px}
.section-title h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.3px}
.section-title .note{font-size:13px;color:var(--ink-3)}
/* ===== home hero ===== */
.hero{background:radial-gradient(circle at 88% 4%,rgba(255,255,255,.13) 0 55px,transparent 56px),radial-gradient(circle at 96% 34%,rgba(255,255,255,.09) 0 40px,transparent 41px),radial-gradient(circle at 80% 12%,rgba(255,255,255,.07) 0 90px,transparent 91px),var(--blue);color:#fff;border-radius:14px;padding:18px 18px 16px;position:relative}
.hero .kicker{font-size:12px;letter-spacing:2px;color:#9CC4D8;margin-bottom:6px}
.hero .big{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:.5px}
.hero .big em{font-style:normal;color:var(--yellow)}
.hero .desc{font-size:13.5px;color:#BBD5E2;margin-top:6px}
.hero-metrics{display:flex;margin-top:16px;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
.hero-metrics div{flex:1;border-right:1px solid rgba(255,255,255,.14);padding-left:2px}
.hero-metrics div:last-child{border-right:0}
.hero-metrics .num{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-metrics .lab{font-size:12px;color:#9CC4D8;margin-top:2px}

/* ===== continue ===== */
.continue{margin-top:12px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.continue:hover{border-color:#BFD3DE}
.continue .ring{width:42px;height:42px;flex:none;border-radius:50%;background:var(--yellow-soft);display:grid;place-items:center;color:#8A6100}
.continue .ring svg{width:20px;height:20px}
.continue .t{font-size:14.5px;font-weight:600}
.continue .d{font-size:13px;color:var(--ink-3)}
.continue .bar{height:4px;background:var(--line-2);border-radius:2px;margin-top:6px;overflow:hidden}
.continue .bar i{display:block;height:100%;background:var(--blue-2)}
.continue .txt{flex:1;min-width:0}

/* ===== mode grid ===== */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.mode:hover{border-color:#BFD3DE;transform:translateY(-1px)}
.mode .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.mode .ico svg{width:17px;height:17px}
.mode .name{font-size:15px;font-weight:700}
.mode .desc{font-size:13px;color:var(--ink-3);line-height:1.45}
.mode .go{position:absolute;right:12px;top:12px;font-size:12px;color:var(--blue-2);border:1px solid #C7DCE8;border-radius:20px;padding:2px 8px;background:#F5FAFC}
.types{display:flex;gap:8px;margin-top:2px}
.tchip{flex:1;display:flex;flex-direction:column;gap:2px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:left;box-shadow:var(--shadow)}
.tchip:hover{border-color:#BFD3DE}
.tchip .n{font-size:13px;color:var(--ink-2)}
.tchip .c{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue)}
.tchip .c small{font-size:11px;font-weight:500;color:var(--ink-3);margin-left:2px}

/* ===== quiz ===== */
.gauge{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.gauge .track{position:relative;flex:1;height:10px;border-radius:5px;background:#DDE8EE}
.gauge .fill{height:100%;border-radius:5px;background:var(--blue);transition:width .25s ease}
.gauge .ticks{position:absolute;inset:0;border-radius:5px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 10%);pointer-events:none}
.gauge .needle{position:absolute;top:-4px;width:2px;height:18px;background:var(--yellow);border-radius:2px;transition:left .25s ease;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.gauge .cnt{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
.qhead{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.badge{font-size:12px;font-weight:600;letter-spacing:.5px;padding:2px 8px;border-radius:5px;background:var(--blue-soft);color:var(--blue)}
.badge.s{background:var(--yellow-soft);color:#8A6100}
.qno{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 16px;box-shadow:var(--shadow)}
.stem{font-size:17.5px;line-height:1.62;letter-spacing:.2px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);border-radius:10px;background:#FBFCFD;padding:12px 13px;font-size:15.5px;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover{border-color:#BFD3DE;background:#fff}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-variant-numeric:tabular-nums}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .key{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .key{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .key{background:var(--red);color:#fff;border-color:var(--red)}
.opt.miss{border-color:var(--yellow);background:var(--yellow-soft)}
.opt.miss .key{background:var(--yellow);color:#5B4200;border-color:var(--yellow)}
.judge-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.jopt{border:1px solid var(--line);border-radius:10px;background:#FBFCFD;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:600}
.jopt .mk{font-size:24px;line-height:1;font-weight:700}
.jopt:hover{border-color:#BFD3DE}
.jopt.sel{border-color:var(--blue);background:var(--blue-soft)}
.jopt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.jopt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.verdict{margin-top:14px;border-radius:10px;padding:11px 13px;font-size:14px;line-height:1.55;display:flex;gap:9px;align-items:flex-start}
.verdict.ok{background:var(--green-soft);color:#1F5A3D}
.verdict.no{background:var(--red-soft);color:#7E2A1B}
.verdict.tip{background:var(--yellow-soft);color:#6A4B00}
.verdict svg{width:16px;height:16px;flex:none;margin-top:2px}
.actions{position:sticky;bottom:0;margin:auto -16px -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,rgba(241,245,246,0));display:flex;gap:9px;align-items:center}
.btn{height:var(--tap);border-radius:10px;font-size:15px;font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--blue);color:#fff;flex:1}
.btn.primary:hover{background:#123F59}
.btn.primary[disabled]{background:#B7C7D0;color:#EEF3F6;cursor:not-allowed}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{border-color:#BFD3DE}
.btn.small{height:38px;font-size:13px;padding:0 12px;border-radius:8px}
.btn.primary.small{flex:none}
.btn svg{width:17px;height:17px}
.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.sheet .cell{aspect-ratio:1/1;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;font-variant-numeric:tabular-nums;display:grid;place-items:center;color:var(--ink-2)}
.sheet .cell.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.sheet .cell.ok{background:var(--green-soft);border-color:#A9CFBB;color:#1F5A3D}
.sheet .cell.bad{background:var(--red-soft);border-color:#E3B4A8;color:#7E2A1B}
.sheet .cell.now{outline:2px solid var(--yellow);outline-offset:1px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;width:100%}
.row:hover{border-color:#BFD3DE}
.row .txt{flex:1;min-width:0}
.row .meta{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.row .tag{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
.row .no{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .stemtxt{font-size:14px;line-height:1.55;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .side{flex:none;color:var(--ink-3)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .k{font-size:13px;color:var(--ink-3)}
.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue);line-height:1.3}
.stat .v small{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:2px}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.bar-row .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.bar-row .lab b{font-variant-numeric:tabular-nums;color:var(--ink)}
.bar-row .track{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar-row .track i{display:block;height:100%;background:var(--blue-2);border-radius:4px}
.bar-row .track i.g{background:var(--green)}
.bar-row .track i.y{background:var(--yellow)}
.result-hero{text-align:center;padding:22px 16px 18px;background:var(--blue);color:#fff;border-radius:14px}
.result-hero .score{font-size:52px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.result-hero .score small{font-size:15px;font-weight:500;color:#9CC4D8}
.result-hero .tag2{display:inline-block;margin-top:8px;font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.16)}
.result-hero .pass{background:#2C7752;color:#fff}
.result-hero .fail{background:#8A3324;color:#fff}
.result-meta{display:flex;margin-top:16px;border-top:1px solid rgba(255,255,255,.16);padding-top:12px;text-align:left}
.result-meta div{flex:1}
.result-meta .num{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.result-meta .lab{font-size:12px;color:#9CC4D8}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty .big{font-size:15.5px;color:var(--ink-2);margin-bottom:6px}
.empty .sub{font-size:13px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:rgba(18,33,43,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(14,26,34,.42);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .panel{width:100%;max-width:560px;background:var(--paper);border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:82dvh;overflow:auto}
.modal .panel .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.modal .panel .head h3{margin:0;font-size:15px}
.modal .panel .head .spacer{flex:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
@media (max-width:360px){
  .hero .big{font-size:26px}
  .sheet{grid-template-columns:repeat(5,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="iconbtn" id="btnBack" aria-label="返回" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="min-width:0">
      <h1 id="appTitle">电工考证刷题</h1>
      <div class="sub" id="appSub">电工竞赛项目理论知识题库</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnSheet" aria-label="答题卡" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button class="iconbtn" id="btnReset" aria-label="清空记录" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20h-6v-6H10v6H4z"/></svg>
      首页
    </button>
    <button data-tab="wrong">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 4h12v16l-6-4-6 4z"/><path d="M9.5 9.5 14.5 14.5M14.5 9.5 9.5 14.5"/></svg>
      错题本
    </button>
    <button data-tab="fav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m12 4 2.4 5 5.6.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.6-.8z"/></svg>
      收藏
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      统计
    </button>
  </nav>
</div>
<div class="modal" id="modal">
  <div class="panel">
    <div class="head">
      <h3>答题卡</h3>
      <span class="qno" id="modalCount"></span>
      <div class="spacer"></div>
      <button class="btn small ghost" id="modalClose">关闭</button>
    </div>
    <div class="sheet" id="sheetGrid"></div>
    <div class="legend">
      <span><i style="background:var(--blue-soft);border:1px solid var(--blue)"></i>当前</span>
      <span><i style="background:var(--green-soft);border:1px solid #A9CFBB"></i>答对</span>
      <span><i style="background:var(--red-soft);border:1px solid #E3B4A8"></i>答错</span>
      <span><i style="background:#fff;border:1px solid var(--line)"></i>未答</span>
    </div>
  </div>
</div>

// ================= 数据层 =================
const $ = s => document.querySelector(s);
const MAP = new Map(QS.map(q => [q.id, q]));
const TYPE_NAME = { j: '判断题', s: '单选题', m: '多选题' };
const TYPE_SHORT = { j: '判断', s: '单选', m: '多选' };
const LS = 'dg_tiku_v1';

function blankDB() {
  return {
    wrong: {}, fav: {},
    stat: { j: { a: 0, c: 0 }, s: { a: 0, c: 0 }, m: { a: 0, c: 0 } },
    hist: [], last: null, exams: 0, pos: { j: 0, s: 0, m: 0 }
  };
}
let DB = blankDB();
try {
  const raw = localStorage.getItem(LS);
  if (raw) {
    const p = JSON.parse(raw);
    if (p && p.stat && p.stat.j) DB = Object.assign(blankDB(), p);
  }
} catch (e) { /* 本地存储不可用时退化为内存模式 */ }

let storageOK = true;
try { localStorage.setItem('__probe', '1'); localStorage.removeItem('__probe'); } catch (e) { storageOK = false; }

if (!DB.pos || typeof DB.pos.j !== 'number') {
  const pos = { j: 0, s: 0, m: 0 };
  const lb = (DB.last && DB.last.label) || '';
  const t = lb.indexOf('判断') === 0 ? 'j' : lb.indexOf('单选') === 0 ? 's' : lb.indexOf('多选') === 0 ? 'm' : null;
  if (t && DB.last && DB.last.list) pos[t] = Math.min(DB.last.idx || 0, Math.max(0, DB.last.list.length - 1));
  DB.pos = pos;
}

function save() {
  try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) {}
}
const answeredAll = () => DB.stat.j.a + DB.stat.s.a + DB.stat.m.a;
const answeredInType = t => (DB.stat[t] && DB.stat[t].a) ? 1 : 0;
const correctAll = () => DB.stat.j.c + DB.stat.s.c + DB.stat.m.c;
const accAll = () => answeredAll() ? Math.round(correctAll() / answeredAll() * 100) : 0;
const wrongIds = () => Object.keys(DB.wrong);
const favIds = () => Object.keys(DB.fav);
function timeAgo(ts) {
  if (!ts) return '';
  const d = Date.now() - ts;
  if (d < 60e3) return '刚刚';
  if (d < 3600e3) return Math.floor(d / 60e3) + ' 分钟前';
  if (d < 86400e3) return Math.floor(d / 3600e3) + ' 小时前';
  return Math.floor(d / 86400e3) + ' 天前';
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1600);
}
const pad2 = n => String(n).padStart(2, '0');
function mmss(sec) { sec = Math.max(0, sec); return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ================= 视图切换 =================
let VIEW = 'home';
let S = null;
let WRONG_T = null;
let FAV_T = null;

function setChrome(opts) {
  $('#appTitle').textContent = opts.title;
  $('#appSub').textContent = opts.sub || '';
  $('#btnBack').hidden = !opts.back;
  $('#btnSheet').hidden = !opts.sheet;
  $('#btnReset').hidden = !opts.reset;
  $('#tabbar').style.display = opts.tab === false ? 'none' : 'grid';
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === VIEW));
}

function goHome() {
  S = null; VIEW = 'home';
  setChrome({ title: '电工考证刷题', sub: '电工竞赛项目理论知识题库' });
  renderHome();
}
function goTab(tab) {
  S = null; VIEW = tab;
  if (tab === 'wrong') {
    WRONG_T = null;
    renderWrong();
  } else if (tab === 'fav') {
    FAV_T = null;
    renderFav();
  } else if (tab === 'stats') {
    setChrome({ title: '学习统计', sub: '记录保存在本机', back: false, reset: true });
    renderStats();
  } else {
    goHome();
  }
}

// ================= 首页 =================
function renderHome() {
  const last = DB.last;
  const lastQ = last ? MAP.get(last.list[last.idx]) : null;
  const pct = last ? Math.round((last.idx + 1) / last.list.length * 100) : 0;
  $('#view').innerHTML = `
  <section class="hero">
    <div class="kicker">电工竞赛 · 理论知识</div>
    <div class="big">${QS.length}<em> 道</em></div>
    <div class="desc">判断 ${QS.filter(q=>q.t==='j').length} · 单选 ${QS.filter(q=>q.t==='s').length} · 多选 ${QS.filter(q=>q.t==='m').length}，答案已对齐原题库</div>
    <div class="hero-metrics">
      <div><div class="num">${answeredAll()}</div><div class="lab">累计作答</div></div>
      <div><div class="num">${accAll()}%</div><div class="lab">正确率</div></div>
      <div><div class="num">${wrongIds().length}</div><div class="lab">错题</div></div>
    </div>
  </section>

  ${last && lastQ ? `
  <button class="continue" id="btnContinue">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 4v16l13-8z"/></svg>
    </div>
    <div class="txt">
      <div class="t">继续练习 · ${esc(last.label)}</div>
      <div class="d">上次做到第 ${last.idx + 1} / ${last.list.length} 题</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
  </button>` : ''}

  <div class="section-title"><h2>顺序练习</h2><span class="note">按题库原顺序，边做边看答案</span></div>
  <div class="types">
    ${['j', 's', 'm'].map(t => `
      <button class="tchip" data-type="${t}">
        <span class="n">${TYPE_NAME[t]}${(DB.pos[t] || 0) > 0 ? ' · 第 ' + (DB.pos[t] + 1) + ' 题' : (answeredInType(t) ? ' · 从头再刷' : '')}</span>
        <span class="c">${QS.filter(q => q.t === t).length}<small>道</small></span>
      </button>`).join('')}
  </div>

  <div class="section-title"><h2>其他模式</h2><span class="note">随机刷、模拟考</span></div>
  <div class="modes">
    <button class="mode" id="btnRandom">

// ================= 简易确认框 =================
function askConfirm(text, onYes) {
  const wrap = document.createElement('div');
  wrap.className = 'modal on';
  wrap.style.zIndex = 70;
  wrap.innerHTML = `<div class="panel" style="border-radius:14px;margin:0 14px 25vh;padding:18px">
    <div style="font-size:15px;line-height:1.6;margin-bottom:16px">${esc(text)}</div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" style="flex:1" data-a="no">取消</button>
      <button class="btn primary" style="flex:1" data-a="yes">确定</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector('[data-a="no"]').onclick = close;
  wrap.querySelector('[data-a="yes"]').onclick = () => { close(); onYes(); };
  wrap.onclick = e => { if (e.target === wrap) close(); };
}
// ================= 会话 =================
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const idsOf = t => QS.filter(q => q.t === t).map(q => q.id);

function startPractice(t) {
  const ids = idsOf(t);
  const p = Math.min(Math.max(0, (DB.pos && DB.pos[t]) || 0), Math.max(0, ids.length - 1));
  startSession(ids, 'practice', TYPE_NAME[t] + ' · 顺序练习', 'home', p, t);
  if (p > 0) toast('接着上次，从第 ' + (p + 1) + ' 题继续');
}
function startRandom() {
  startSession(shuffle(QS.map(q => q.id)).slice(0, 50), 'practice', '随机练习');
}
function startExam() {
  const ids = [
    ...shuffle(idsOf('j')).slice(0, 30),
    ...shuffle(idsOf('s')).slice(0, 50),
    ...shuffle(idsOf('m')).slice(0, 20)
  ];
  startSession(ids, 'exam', '模拟考试');
  S.left = 3600;
  S.endAt = Date.now() + 3600e3;
  S.timer = setInterval(() => {
    S.left = Math.round((S.endAt - Date.now()) / 1000);
    const el = $('#gaugeCnt');
    if (el) el.textContent = mmss(S.left);
    const clock = document.querySelector('.topbar .sub');
    if (clock) clock.textContent = '剩余 ' + mmss(S.left);
    if (S.left <= 0) { clearInterval(S.timer); S.timer = null; submitExam(true); }
  }, 1000);
}

function startSession(ids, mode, label, origin, start, type) {
  const list = ids.filter(id => MAP.get(id));
  if (!list.length) { toast('这里还没有题目'); return; }
  if (S && S.timer) { clearInterval(S.timer); S.timer = null; }
  S = {
    ids: list, mode, label, type: type || null,
    idx: Math.min(Math.max(0, start || 0), list.length - 1),
    sel: (start || 0) > 0 ? [] : [], answers: {}, submitted: {}, res: {}, recorded: {},
    startTs: Date.now(), left: 0, endAt: null, timer: null, origin: origin || 'home'
  };
  VIEW = 'quiz';
  setChrome({
    title: mode === 'exam' ? '模拟考试' : (mode === 'review' ? '查看题目' : label),
    sub: mode === 'exam' ? '剩余 60:00' : (mode === 'review' ? '已显示答案' : ''),
    back: true, sheet: true, tab: false
  });
  if (mode === 'exam') $('#appSub').textContent = '剩余 60:00';
  renderQuiz();
}

function cur() { return MAP.get(S.ids[S.idx]); }
const isLocked = q => S.submitted[q.id];
const selOf = id => (S.answers[id] ? S.answers[id].split('') : []);

function goto(i) {
  if (!S) return;
  if (i < 0) return;
  if (i >= S.ids.length) { finishPractice(); return; }
  S.idx = i;
  S.sel = selOf(S.ids[i]);
  if (S.mode === 'practice') {
    DB.last = { list: S.ids, idx: S.idx, label: S.label };
    if (S.type && DB.pos) DB.pos[S.type] = S.idx;
    save();
  }
  renderQuiz();
}

function record(q, ok) {
  if (S.recorded[q.id]) return;
  S.recorded[q.id] = true;
  DB.stat[q.t].a++;
  if (ok) DB.stat[q.t].c++;
  if (!ok) DB.wrong[q.id] = (DB.wrong[q.id] || 0) + 1;
  else if (DB.wrong[q.id]) delete DB.wrong[q.id];
  save();
}

function submitPractice() {
  const q = cur();
  if (S.sel.length === 0) { toast('先选一个答案'); return; }
  const got = S.sel.slice().sort().join('');
  const ok = got === q.a;
  const wasWrong = !!DB.wrong[q.id];
  S.submitted[q.id] = true;
  S.res[q.id] = ok;
  S.answers[q.id] = got;
  S.sel = got.split('');
  record(q, ok);
  renderQuiz();
}

function finishPractice() {
  if (!S) return;
  if (S.mode === 'exam') { submitExam(false); return; }
  if (S.mode === 'practice' && S.type && DB.pos) {
    DB.pos[S.type] = 0;
    if (DB.last && DB.last.label === S.label) DB.last = null;
    save();
  }
  const done = Object.keys(S.submitted).length;
  const right = Object.values(S.res).filter(Boolean).length;
  const pct = done ? Math.round(right / done * 100) : 0;
  const meta = { mode: S.mode, done, right, pct, label: S.label, total: S.ids.length };
  S = null;
  VIEW = 'done';
  setChrome({ title: '完成', sub: '', back: true, tab: false });
  $('#view').innerHTML = `
    <div class="result-hero">
      ${done ? `<div class="score" style="font-size:40px">${right}<small> / ${done} 题</small></div>
      <div class="tag2 ${pct >= 90 ? 'pass' : (pct >= 60 ? '' : 'fail')}">正确率 ${pct}%</div>`
      : `<div class="score" style="font-size:26px">本组没有作答</div>
      <div class="tag2">跳过的题目不计入正确率</div>`}
      <div class="result-meta">
        <div><div class="num">${meta.total}</div><div class="lab">本组题量</div></div>
        <div><div class="num">${done - right}</div><div class="lab">本组答错</div></div>
        <div><div class="num">${wrongIds().length}</div><div class="lab">错题累计</div></div>
      </div>
    </div>
    <div class="section-title"><h2>接下来</h2></div>
    <div class="modes">
      <button class="mode" id="btnAgain">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg></div>
        <div class="name">再练一组</div><div class="desc">同类型题目再来一遍</div>
      </button>
      <button class="mode" id="btnWrongGo">
        <div class="ico" style="background:var(--red-soft);color:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 4h12v16l-6-4-6 4z"/></svg></div>
        <div class="name">去错题本</div><div class="desc">${wrongIds().length} 道待攻克</div>
      </button>
    </div>
    <div style="margin-top:14px"><button class="btn ghost" id="btnHome" style="width:100%">返回首页</button></div>
  `;
  $('#btnAgain').onclick = () => { if (meta.mode === 'practice') startPractice(guessType(meta.label)); else goHome(); };
  $('#btnWrongGo').onclick = () => goTab('wrong');
  $('#btnHome').onclick = () => goHome();
}
function guessType(label) {
  if (label.indexOf('判断') === 0) return 'j';
  if (label.indexOf('单选') === 0) return 's';
  if (label.indexOf('多选') === 0) return 'm';
  return 's';
}
function resumeLast() {
  const last = DB.last;
  if (!last || !last.list || !last.list.length) { goHome(); return; }
  const lb = last.label || '';
  const t = lb.indexOf('判断') === 0 ? 'j' : lb.indexOf('单选') === 0 ? 's' : lb.indexOf('多选') === 0 ? 'm' : null;
  if (t && last.list.length === idsOf(t).length) { startPractice(t); return; }
  startSession(last.list, 'practice', last.label, 'home', last.idx);
}

// ================= 答题页 =================
function renderQuiz() {
  if (!S) { goHome(); return; }
  const q = cur();
  const locked = isLocked(q);
  const n = S.ids.length;
  const pos = S.idx + 1;
  const answered = S.mode === 'exam' ? (S.answers[q.id] ? 1 : 0) : (locked ? 1 : 0);
  const right = S.res[q.id] === true;
  const showed = S.mode === 'review' || (S.mode === 'practice' && locked);
  const pct = Math.round(pos / n * 100);

  $('#appTitle').textContent = S.mode === 'exam' ? '模拟考试' : (S.mode === 'review' ? '查看题目' : S.label);
  $('#appSub').textContent = S.mode === 'exam' ? '剩余 ' + mmss(S.left) : (S.mode === 'review' ? '已显示答案' : '第 ' + pos + ' 题');

  let body = '';
  if (q.t === 'j') {
    const sel = S.sel[0];
    const keys = ['√', '×'];
    body = `<div class="judge-opts">${keys.map(k => {
      let cls = '';
      if (!showed) cls = sel === k ? ' sel' : '';
      else {
        if (q.a === k) cls = ' right';
        else if (sel === k) cls = ' wrong';
      }
      return `<button class="jopt${cls}" data-k="${k}">
        <span class="mk">${k}</span><span>${k === '√' ? '正确' : '错误'}</span>
      </button>`;
    }).join('')}</div>`;
  } else {
    body = `<div class="opts">${q.o.map((txt, i) => {
      const k = 'ABCDE'[i];
      let cls = '';
      if (!showed) cls = S.sel.indexOf(k) >= 0 ? ' sel' : '';
      else {
        const inAns = q.a.indexOf(k) >= 0;
        const picked = S.sel.indexOf(k) >= 0;
        if (inAns && picked) cls = ' right';
        else if (inAns) cls = ' miss';
        else if (picked) cls = ' wrong';
      }
      return `<button class="opt${cls}" data-k="${k}">
        <span class="key">${k}</span><span>${esc(txt)}</span>
      </button>`;
    }).join('')}</div>`;
  }

  let verdict = '';
  if (showed) {
    if (S.mode === 'review') {
      verdict = `<div class="verdict tip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16v-5M12 8h.01"/></svg>
        <span>正确答案：<b>${q.a}</b>${q.t === 'j' ? (q.a === '√' ? '（正确）' : '（错误）') : ''}</span></div>`;
    } else if (right) {
      verdict = `<div class="verdict ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
        <span>答对了</span></div>`;
    } else {
      verdict = `<div class="verdict no">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span>答错了，正确答案：<b>${q.a}</b>${q.t === 'j' ? (q.a === '√' ? '（正确）' : '（错误）') : ''}</span></div>`;
    }
  }

  const fav = DB.fav[q.id];
  const actions = [];
  if (S.idx > 0) actions.push(`<button class="btn ghost" id="btnPrev">上一题</button>`);
  if (S.mode === 'exam') {
    if (S.idx < n - 1) actions.push(`<button class="btn primary" id="btnNext">下一题</button>`);
    actions.push(`<button class="btn ${S.idx < n - 1 ? 'ghost' : 'primary'}" id="btnHand">交卷</button>`);
  } else if (S.mode === 'review') {
    actions.push(`<button class="btn primary" id="btnNext">${S.idx < n - 1 ? '下一题' : '完成'}</button>`);
  } else {
    if (!locked && q.t === 'm') {
      actions.push(`<button class="btn primary" id="btnSubmit" ${S.sel.length ? '' : 'disabled'}>确认答案</button>`);
    } else if (!locked) {
      actions.push(`<button class="btn primary" id="btnSubmit" ${S.sel.length ? '' : 'disabled'}>确认答案</button>`);
    } else {
      actions.push(`<button class="btn primary" id="btnNext">${S.idx < n - 1 ? '下一题' : '完成练习'}</button>`);
    }
  }

  $('#view').innerHTML = `
    <div class="gauge">
      <div class="track">
        <div class="fill" style="width:${pct}%"></div>
        <div class="ticks"></div>
        <div class="needle" style="left:calc(${pct}% - 1px)"></div>
      </div>
      <div class="cnt" id="gaugeCnt">${S.mode === 'exam' ? mmss(S.left) : pos + ' / ' + n}</div>
    </div>

    <div class="qhead">
      <span class="badge ${q.t === 's' ? 's' : ''}">${TYPE_NAME[q.t]}</span>
      <span class="qno">${S.mode === 'exam' ? '本次考卷第 ' + pos + ' 题' : '题库第 ' + q.n + ' 题'}</span>
      <div class="spacer"></div>
      <button class="iconbtn" id="btnFav" aria-label="收藏" style="color:${fav ? '#B58700' : 'var(--ink-3)'}">
        <svg viewBox="0 0 24 24" fill="${fav ? '#F2B322' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m12 4 2.4 5 5.6.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.6-.8z"/></svg>
      </button>
    </div>

    <div class="qcard">
      <div class="stem">${esc(q.s)}</div>
      ${body}
      ${verdict}
    </div>

    <div class="actions">${actions.join('')}</div>
  `;

  $('#btnFav').onclick = () => {
    if (DB.fav[q.id]) { delete DB.fav[q.id]; toast('已取消收藏'); }
    else { DB.fav[q.id] = 1; toast('已收藏'); }
    save(); renderQuiz();
  };
  document.querySelectorAll('.opt, .jopt').forEach(el => {
    el.onclick = () => pick(el.dataset.k);
  });
  const b = id => document.getElementById(id);
  if (b('btnPrev')) b('btnPrev').onclick = () => goto(S.idx - 1);
  if (b('btnNext')) b('btnNext').onclick = () => {
    if (S.mode === 'review') { S.idx + 1 < n ? goto(S.idx + 1) : (function(){ const cnt = S; S = null; VIEW='home'; setChrome({title:'电工考证刷题',sub:'电工竞赛项目理论知识题库'}); renderHome(); })(); }
    else goto(S.idx + 1);
  };
  if (b('btnSubmit')) b('btnSubmit').onclick = () => S.mode === 'exam' ? saveExamAnswer() : submitPractice();
  if (b('btnHand')) b('btnHand').onclick = () => {
    const un = S.ids.filter(id => !S.answers[id]).length;
    askConfirm(un ? `还有 ${un} 题没答，确定交卷？` : '确定交卷？', () => submitExam(false));
  };
}

function pick(k) {
  if (!S || !MAP.get(S.ids[S.idx])) return;
  const q = cur();
  if (S.mode === 'review') return;
  if (S.mode === 'exam') {
    if (q.t === 'm') {
      const cur2 = selOf(q.id);
      const i = cur2.indexOf(k);
      if (i >= 0) cur2.splice(i, 1); else cur2.push(k);
      S.answers[q.id] = cur2.sort().join('');
      S.sel = selOf(q.id);
    } else {
      S.answers[q.id] = k;
      S.sel = [k];
    }
    renderQuiz();
    return;
  }
  const locked = isLocked(q);
  if (locked) return;
  if (q.t === 'm') {
    const i = S.sel.indexOf(k);
    if (i >= 0) S.sel.splice(i, 1); else S.sel.push(k);
    S.sel.sort();
    renderQuiz();
    return;
  }
  S.sel = [k];
  submitPractice();
}

function saveExamAnswer() {
  const q = cur();
  if (!S.answers[q.id]) { toast('先选一个答案'); return; }
  goto(S.idx + 1);
}

// ================= 交卷 =================
function submitExam(byTimeout) {
  if (!S) return;
  const { ids, mode, startTs } = S;
  let correct = 0;
  const per = { j: { c: 0, t: 0 }, s: { c: 0, t: 0 }, m: { c: 0, t: 0 } };
  const wrongNow = [];
  ids.forEach(id => {
    const q = MAP.get(id);
    per[q.t].t++;
    const got = S.answers[id] || '';
    const ok = got === q.a;
    if (ok) { correct++; per[q.t].c++; }
    else {
      wrongNow.push(id);
      DB.wrong[id] = (DB.wrong[id] || 0) + 1;
      DB.stat[q.t].a++;
    }
    if (ok) { DB.stat[q.t].a++; DB.stat[q.t].c++; }
  });
  const total = ids.length;
  const score = Math.round(correct / total * 100);
  const dur = Math.min(3600, Math.round((Date.now() - startTs) / 1000));
  DB.hist.unshift({
    date: new Date().toLocaleString('zh-CN', { hour12: false }).slice(0, 16),
    score, correct, total, dur
  });
  DB.hist = DB.hist.slice(0, 30);
  save();
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  S = null;
  VIEW = 'result';
  setChrome({ title: '考试结果', sub: byTimeout ? '时间到，已自动交卷' : '', back: true, tab: false });
  renderResult({ score, correct, total, dur, per, wrongNow, byTimeout });
}

function renderResult(r) {
  const pass = r.score >= 90;
  const types = ['j', 's', 'm'].map(t => {
    const p = r.per[t];
    const pct = p.t ? p.c / p.t * 100 : 0;
    return `<div class="bar-row">
      <div class="lab"><span>${TYPE_NAME[t]}</span><b>${p.c} / ${p.t}</b></div>
      <div class="track"><i class="${pct >= 90 ? 'g' : (pct >= 60 ? '' : 'y')}" style="width:${pct}%"></i></div>
    </div>`;
  }).join('');

  $('#view').innerHTML = `
    <div class="result-hero">
      <div class="score">${r.score}<small> 分</small></div>
      <div class="tag2 ${pass ? 'pass' : 'fail'}">${pass ? '及格 · 保持这个状态' : '未及格 · 还差 ' + (90 - r.score) + ' 分'}</div>
      <div class="result-meta">
        <div><div class="num">${r.correct} / ${r.total}</div><div class="lab">答对题数</div></div>
        <div><div class="num">${mmss(r.dur)}</div><div class="lab">考试用时</div></div>
        <div><div class="num">${r.total - r.correct}</div><div class="lab">答错题数</div></div>
      </div>
    </div>

    <div class="section-title"><h2>分题型表现</h2><span class="note">每题 1 分</span></div>
    <div class="card"><div class="bars">${types}</div></div>

    <div class="section-title"><h2>错题回顾</h2><span class="note">${r.wrongNow.length} 道，已存入错题本</span></div>
    ${r.wrongNow.length ? `<div class="rows">${r.wrongNow.slice(0, 8).map(id => {
      const q = MAP.get(id);
      return `<button class="row" data-id="${id}">
        <div class="txt">
          <div class="meta"><span class="tag">${TYPE_NAME[q.t]}</span><span class="no">第 ${q.n} 题</span><span class="no">正确 ${q.a}</span></div>
          <div class="stemtxt">${esc(q.s)}</div>
        </div>
        <div class="side"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></div>
      </button>`;
    }).join('')}${r.wrongNow.length > 8 ? `<div class="card" style="text-align:center;font-size:12.5px;color:var(--ink-3)">还有 ${r.wrongNow.length - 8} 道在错题本里</div>` : ''}</div>`
      : `<div class="card" style="text-align:center;font-size:13px;color:var(--green)">全部答对，这轮没有错题</div>`}

    <div class="modes" style="margin-top:16px">
      <button class="mode" id="btnExamAgain"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg></div><div class="name">再考一次</div><div class="desc">重新抽题，60 分钟</div></button>
      <button class="mode" id="btnWrongRedo"><div class="ico" style="background:var(--red-soft);color:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 4h12v16l-6-4-6 4z"/></svg></div><div class="name">重做错题</div><div class="desc">${wrongIds().length} 道待攻克</div></button>
    </div>
    <div style="margin-top:14px"><button class="btn ghost" id="btnHome2" style="width:100%">返回首页</button></div>
  `;
  $('#btnExamAgain').onclick = () => startExam();
  $('#btnWrongRedo').onclick = () => wrongIds().length ? startSession(wrongIds(), 'practice', '错题重做', 'wrong') : toast('错题本是空的');
  $('#btnHome2').onclick = () => goHome();
  document.querySelectorAll('.row').forEach(el => el.onclick = () => startSession([el.dataset.id], 'review', '错题查看', 'wrong'));
}

// ================= 答题卡 =================
function openSheet() {
  if (!S) return;
  const grid = $('#sheetGrid');
  grid.innerHTML = S.ids.map((id, i) => {
    const q = MAP.get(id);
    let cls = '';
    if (S.mode === 'exam') {
      if (S.answers[id]) cls = 'on';
    } else if (S.mode === 'review') {
      cls = '';
    } else {
      if (S.submitted[id]) cls = S.res[id] ? 'ok' : 'bad';
    }
    if (i === S.idx) cls += ' now';
    return `<button class="cell ${cls}" data-i="${i}">${i + 1}</button>`;
  }).join('');
  $('#modalCount').textContent = S.mode === 'exam'
    ? `已答 ${S.ids.filter(id => S.answers[id]).length} / ${S.ids.length}`
    : `第 ${S.idx + 1} / ${S.ids.length} 题`;
  $('#modal').classList.add('on');
  grid.querySelectorAll('.cell').forEach(c => c.onclick = () => {
    $('#modal').classList.remove('on');
    goto(parseInt(c.dataset.i, 10));
  });
}

// ================= 初始化与事件 =================
$('#btnBack').onclick = () => {
  if (!S && VIEW === 'wrong' && WRONG_T) { goTab('wrong'); return; }
  if (!S && VIEW === 'fav' && FAV_T) { goTab('fav'); return; }
  if (S && S.mode === 'exam') {
    askConfirm('正在考试，返回会放弃本次成绩，确定退出？', () => { if (S.timer) clearInterval(S.timer); S = null; goHome(); });
    return;
  }
  if (S && S.mode === 'review') { const o = S.origin; S = null; goTab(o); return; }
  if (S && S.mode === 'practice') { S = null; }
  goHome();
};
$('#btnSheet').onclick = openSheet;
$('#modalClose').onclick = () => $('#modal').classList.remove('on');
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').classList.remove('on'); };
$('#btnReset').onclick = () => askConfirm('清空全部学习记录？错题、收藏、进度和成绩都会删除，无法恢复。', () => {
  DB = blankDB(); save(); toast('已清空'); goTab('stats');
});
document.querySelectorAll('#tabbar button').forEach(b => {
  b.onclick = () => {
    if (S && S.mode === 'exam') {
      askConfirm('正在考试，离开会放弃本次成绩，确定？', () => { if (S.timer) clearInterval(S.timer); S = null; goTab(b.dataset.tab); });
      return;
    }
    if (S && S.timer) { clearInterval(S.timer); S = null; }
    goTab(b.dataset.tab);
  };
});
document.addEventListener('keydown', e => {
  if (!S || !MAP.get(S.ids[S.idx])) return;
  if (e.key === 'ArrowLeft') { if (S.idx > 0) goto(S.idx - 1); return; }
  if (e.key === 'ArrowRight') { goto(S.idx + 1); return; }
  if (e.key === 'Enter') {
    if (S.mode === 'exam') { S.idx < S.ids.length - 1 ? goto(S.idx + 1) : submitExam(false); }
    else if (!isLocked(cur())) submitPractice();
    else goto(S.idx + 1);
    return;
  }
  const map = { a: 'A', b: 'B', c: 'C', d: 'D', e: 'E' };
  const k = map[e.key.toLowerCase()];
  if (k) {
    const q = cur();
    if (q.t === 'j') { if (k === 'A') pick('√'); if (k === 'B') pick('×'); return; }
    if (k.charCodeAt(0) - 65 < q.o.length) pick(k);
  }
});

goHome();
if (!storageOK) setTimeout(() => toast('当前打开方式无法保存进度，换用浏览器打开更稳妥'), 800);
</script>
</body>
</html>
